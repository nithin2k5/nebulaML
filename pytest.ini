[pytest]
# Both suites: repo-root tests/ (unit) and server/test_*.py (mixed unit/integration).
testpaths = tests server
python_files = test_*.py
python_functions = test_*

# Integration tests need a live MySQL (and sometimes a running API), so they are
# opt-in: `pytest -m integration` runs them, a bare `pytest` skips them.
addopts = -m "not integration"

markers =
    integration: requires a live MySQL database and/or a running API server

asyncio_mode = auto
